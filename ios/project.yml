name: Palm
options:
  bundleIdPrefix: ai.zaiq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # Your own bundle id: set PALM_BUNDLE_ID (and PALM_TEAM_ID) when building.
    PALM_BUNDLE_ID: ai.zaiq.palm
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 40
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_MODULES: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Palm:
    type: application
    platform: iOS
    sources:
      - path: Palm
        excludes: [Resources/Info.plist]
      - path: ../shared/PalmRealtimeAudio.swift
      - path: ../shared/PalmCall.swift
    dependencies:
      - package: SwiftTerm
      # Camera-and-mic sound (scripts/fetch-webrtc.sh fetches it).
      - framework: ../vendor/WebRTC.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PALM_BUNDLE_ID)
        PRODUCT_NAME: Palm
        INFOPLIST_FILE: Palm/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: [PalmTests, PalmUITests]
      gatherCoverageData: true
  PalmTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PalmTests]
    dependencies:
      - target: Palm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PALM_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Palm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Palm
        BUNDLE_LOADER: $(TEST_HOST)
  PalmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PalmUITests]
    dependencies:
      - target: Palm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PALM_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Palm
